  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch(e){}

function exportProgress(){
  try {
    const data = { save: save, settings: settings, version: 3, exportedAt: Date.now() };
    const json = JSON.stringify(data);
    return btoa(unescape(encodeURIComponent(json)));
  } catch(e){ console.error(e); return null; }
}

function importProgress(str){
  try {
    const json = decodeURIComponent(escape(atob(str.trim())));
    const data = JSON.parse(json);
    if (!data || !data.save) throw new Error('Неверный формат');
    const s = data.save;
    s.stats = Object.assign(defaultStats(), s.stats || {});
    s.achievements = s.achievements || {};
    s.bestWave = s.bestWave || {};
    save = s;
    if (data.settings) { settings = Object.assign(settings, data.settings); saveSettings(); }
    persistSave(); flushSave();
    return true;
  } catch(e){ console.error(e); return false; }
}

function copyToClipboard(text){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
  return Promise.resolve();
}

const SAVE_KEY = 'td_save_v7';

function defaultStats(){
  return {
    totalKills: 0, totalTowers: 0, totalUpgrades: 0, totalLightnings: 0,
    healersKilled: 0, iceSlowed: 0, sniperKills: 0, maxMoney: 0,
    perfectLevels: 0, speedrunLevels: 0, fogPerfect: 0,
    levelsCompleted: 0, level10Completed: false
  };
}

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      s.stats = Object.assign(defaultStats(), s.stats || {});
      s.achievements = s.achievements || {};
      s.bestWave = s.bestWave || {};
      return s;
    }
  } catch (e) {}
  return { unlockedLevels: 1, bestWave: {}, stats: defaultStats(), achievements: {} };
}

let save = loadSave();
let saveDirty = false;
let saveTimer = 0;

function persistSave() { saveDirty = true; }
function flushSave() {
  if(!saveDirty) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); saveDirty = false; } catch (e) {}
}

function getCompletedLevelsCount() {
  // Если 10-й пройден, значит пройдены все 10
  if (save.stats.level10Completed) return 10;
  // Иначе опираемся на разблокированные уровни (unlockedLevels 1 = пройдено 0, 2 = пройдено 1 и т.д.)
  return Math.min(save.unlockedLevels - 1, 9);
}

let achievementPopupQueue = [];
let achievementPopupActive = null;
let achievementPopupTimer = 0;

function checkAchievements() {
  for(const ach of ACHIEVEMENTS){
    if(save.achievements[ach.id]) continue;
    if(ach.check(save.stats)){
      save.achievements[ach.id] = { date: Date.now() };
      achievementPopupQueue.push(ach);
      persistSave();
    }
  }
  if(!achievementPopupActive && achievementPopupQueue.length > 0){
    achievementPopupActive = achievementPopupQueue.shift();
    achievementPopupTimer = 240;
  }
}

// === УТИЛИТЫ ===
// ============================================================
function dist(x1,y1,x2,y2){ const dx=x2-x1, dy=y2-y1; return Math.sqrt(dx*dx+dy*dy); }
function dist2(x1,y1,x2,y2){ const dx=x2-x1, dy=y2-y1; return dx*dx+dy*dy; }

function distToSeg2(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1;
  const lenSq=dx*dx+dy*dy;
  if(lenSq===0) return dist2(px,py,x1,y1);
  let t=((px-x1)*dx+(py-y1)*dy)/lenSq;
  t=Math.max(0,Math.min(1,t));
  return dist2(px,py,x1+t*dx,y1+t*dy);
}

function distPointToPath(px, py, path) {
  let min = Infinity;
  for (let i = 0; i < path.length - 1; i++) {
    const d2 = distToSeg2(px, py, path[i].x, path[i].y, path[i+1].x, path[i+1].y);
    if (d2 < min) min = d2;
  }
  return Math.sqrt(min);
}

function validateSlots(rawSlots, level, path) {
  const valid = [];
  for (const s of rawSlots) {
    const x = s.c * CELL + CELL/2;
    const y = s.r * CELL + CELL/2;
    if (x < 10 || x > W-10 || y < 10 || y > FIELD_H-10) continue;
    if (distPointToPath(x, y, path) < PATH_CLEAR_SLOT) continue;
    if (level.altPath && distPointToPath(x, y, level.altPath) < PATH_CLEAR_SLOT) continue;
    if (valid.some(v => Math.hypot(v.c-s.c, v.r-s.r) * CELL < SLOT_MIN_GAP)) continue;
    valid.push({c: s.c, r: s.r});
  }

  const need = level.maxTowers + 2;
  if (valid.length < need) {
    const cands = [];
    for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) {
      if (valid.some(v => v.c === c && v.r === r)) continue;
      const x = c*CELL + CELL/2, y = r*CELL + CELL/2;
      const dp = distPointToPath(x, y, path);
      if (dp < PATH_CLEAR_SLOT) continue;
      if (dp > TOWER_MIN_RANGE * 0.95) continue;
      if (level.altPath && distPointToPath(x, y, level.altPath) < PATH_CLEAR_SLOT) continue;
      if (valid.some(v => Math.hypot(v.c-c, v.r-r) * CELL < SLOT_MIN_GAP)) continue;
      cands.push({c, r, dp});
    }
    cands.sort((a, b) => a.dp - b.dp);
    let i = 0;
    while (valid.length < need && i < cands.length) {
      const add = cands[i++];
      if (valid.some(v => Math.hypot(v.c-add.c, v.r-add.r)*CELL < SLOT_MIN_GAP)) continue;
      valid.push({c: add.c, r: add.r});
    }
  }
  return valid;
}

function cellAt(x,y){
  if(x<0||y<0||y>=FIELD_H) return null;
  const col=Math.floor(x/CELL), row=Math.floor(y/CELL);
  if(col<0||col>=COLS||row<0||row>=ROWS) return null;
  return { col, row, x: col*CELL+CELL/2, y: row*CELL+CELL/2 };
}

const particles = [];
const moneyPopups = [];
let screenFlash = 0;
let victoryFireworks = 0;

let shakeAmount = 0;
let shakeTime = 0;
function triggerShake(amount, time){
  if (!settings.screenShake) return;
  shakeAmount = Math.max(shakeAmount, amount);
  shakeTime = Math.max(shakeTime, time);
}

function particleCap(){ return PARTICLE_LIMIT[settings.particles] || 150; }

function spawnParticles(x, y, count, opts){
  opts = opts || {};
  const color = opts.color || '#fff';
  const speed = opts.speed || 3;
  const size = opts.size || 3;
  const life = opts.life || 30;
  const gravity = opts.gravity || 0;
  const limit = particleCap();

  for(let i=0; i<count; i++){
    if(particles.length >= limit) break;
    const ang = opts.angle !== undefined
      ? opts.angle + (Math.random() - 0.5) * (opts.spread || Math.PI*2)
      : Math.random() * Math.PI * 2;
    const sp = speed * (0.5 + Math.random() * 0.7);
    particles.push({
      x, y,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp,
      life: life + Math.random() * 10,
      maxLife: life + 10,
      color,
      size: size * (0.6 + Math.random() * 0.6),
      gravity
    });
  }
}

function spawnMoneyPopup(x, y, amount){
  moneyPopups.push({ x, y, text: '+' + amount, life: 50, maxLife: 50 });
}

function updateParticles(){
  for(let i=particles.length-1; i>=0; i--){
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.vx *= 0.96;
    p.vy *= 0.96;
    p.life--;
    if(p.life <= 0) particles.splice(i, 1);
  }
  for(let i=moneyPopups.length-1; i>=0; i--){
    const m = moneyPopups[i];
    m.y -= 0.8;
    m.life--;
    if(m.life <= 0) moneyPopups.splice(i, 1);
  }
  if(screenFlash > 0) screenFlash *= 0.9;
  if(screenFlash < 0.01) screenFlash = 0;
}

function drawParticles(){
  const groups = new Map();
  for (const p of particles) {
    if (!groups.has(p.color)) groups.set(p.color, []);
    groups.get(p.color).push(p);
  }
  for (const [color, arr] of groups) {
    ctx.fillStyle = color;
    for (const p of arr) {
      const a = p.life / p.maxLife;
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  for(const m of moneyPopups){
    const a = m.life / m.maxLife;
    ctx.font = FONT.num;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = a;
    ctx.fillStyle = '#000';
    ctx.fillText(m.text, m.x + 1, m.y + 1);
    ctx.fillStyle = THEME.gold;
    ctx.fillText(m.text, m.x, m.y);
  }
  ctx.globalAlpha = 1;
}

function spawnExplosion(x, y, radius){
  const count = Math.min(14, Math.floor(radius / 4));
  spawnParticles(x, y, count, { color: '#ffcc00', speed: 4, size: 3, life: 22, gravity: 0.15 });
  spawnParticles(x, y, count, { color: '#ff6b35', speed: 3, size: 4, life: 25, gravity: 0.1 });
  spawnParticles(x, y, Math.floor(count/2), { color: '#fff', speed: 5, size: 2, life: 15 });
  triggerShake(3, 6);
}

function spawnKillParticles(x, y, color){
  spawnParticles(x, y, 10, { color, speed: 3.5, size: 3, life: 25, gravity: 0.2 });
  spawnParticles(x, y, 4, { color: '#fff', speed: 4, size: 2, life: 15 });
}

function spawnFreezeParticles(x, y){
  spawnParticles(x, y, 6, { color: '#5dade2', speed: 1.5, size: 3, life: 35 });
  spawnParticles(x, y, 4, { color: '#d6eaf8', speed: 1, size: 2, life: 30 });
}

function spawnLightningBurst(x, y){
  spawnParticles(x, y, 25, { color: '#ffff66', speed: 7, size: 3, life: 25 });
  spawnParticles(x, y, 10, { color: '#fff', speed: 9, size: 2, life: 15 });
  screenFlash = 0.7;
  triggerShake(5, 10);
}

function isSlot(cell){
  if(!cell) return false;
  return game.slots.some(s => s.c === cell.col && s.r === cell.row);
}
function getTowerAt(cell){
  if(!cell) return null;
  return game.towers.find(t => t.col===cell.col && t.row===cell.row) || null;
}
function hasTower(cell){ return !!getTowerAt(cell); }

function canPlace(cell, cfg){
  if(!cell) return { ok:false, reason:'Нет клетки' };
  if(!isSlot(cell)) return { ok:false, reason:'Только на отмеченных клетках!' };
  if(game.money < cfg.cost) return { ok:false, reason:'Не хватает монет!' };
  if(game.towers.length >= game.maxTowers) return { ok:false, reason:'Лимит башен!' };
  if(hasTower(cell)) return { ok:false, reason:'Клетка занята!' };
  return { ok:true };
}

function log(msg){ debugMsg = msg; debugTimer = 120; }

function upgradeCost(tower){
  const base = TOWERS[tower.type].cost;
  return Math.round(base * UPGRADE_COST_MULT[tower.level]);
}
function towerStats(tower){
  const base = TOWERS[tower.type];
  const extraLvls = tower.level - 1;
  const stats = {
    damage: Math.round(base.damage * (1 + UPGRADE_BONUS.damage * extraLvls) * 10) / 10,
    range: Math.round(base.range * (1 + UPGRADE_BONUS.range * extraLvls)),
    fireRate: Math.max(6, Math.round(base.fireRate * (1 - UPGRADE_BONUS.fireRate * extraLvls))),
    splash: base.splash,
    slow: base.slow,
    bulletSpeed: base.bulletSpeed,
    bulletColor: base.bulletColor,
    color: base.color
  };
  if(game && game.modifiers && game.modifiers.fog){
    stats.range = Math.round(stats.range * FOG_RANGE_MULT);
  }
  return stats;
}

function drawPathTo(c, path, kind){
  if(!path) return;
  const isAlt = kind === 'alt';

  const outerColor = isAlt ? '#3d3020' : '#4a3a25';
  const midColor   = isAlt ? '#6b5540' : '#7d6647';
  const innerColor = isAlt ? '#98825f' : '#a89070';

  c.save();
  c.lineCap = 'butt';
  c.lineJoin = 'miter';
  c.miterLimit = 2;

  c.strokeStyle = outerColor;
  c.lineWidth = 48;
  c.beginPath();
  c.moveTo(path[0].x, path[0].y);
  for(let i=1;i<path.length;i++) c.lineTo(path[i].x, path[i].y);
  c.stroke();

  c.strokeStyle = midColor;
  c.lineWidth = 38;
  c.beginPath();
  c.moveTo(path[0].x, path[0].y);
  for(let i=1;i<path.length;i++) c.lineTo(path[i].x, path[i].y);
  c.stroke();

  c.strokeStyle = innerColor;
  c.lineWidth = 30;
  c.beginPath();
  c.moveTo(path[0].x, path[0].y);
  for(let i=1;i<path.length;i++) c.lineTo(path[i].x, path[i].y);
  c.stroke();

  c.restore();

  c.save();
  c.strokeStyle = isAlt ? 'rgba(255,200,140,0.2)' : 'rgba(255,240,210,0.25)';
  c.lineWidth = 2;
  c.setLineDash([10, 14]);
  c.lineCap = 'butt';
  c.beginPath();
  c.moveTo(path[0].x, path[0].y);
  for(let i=1;i<path.length;i++) c.lineTo(path[i].x, path[i].y);
  c.stroke();
  c.restore();
}

function decorTouchesPath(x, y, path, margin) {
  return distPointToPath(x, y, path) < margin;
}

function decorTouchesSlots(x, y, slots, margin) {
  for (const s of slots) {
    const sx = s.c * CELL + CELL/2;
    const sy = s.r * CELL + CELL/2;
    if (Math.hypot(x - sx, y - sy) < margin) return true;
  }
  return false;
}

function drawSlotBaseTo(c, x, y, occupied){
  c.save();
  c.shadowColor = 'rgba(0,0,0,0.55)';
  c.shadowBlur = 6;
  c.shadowOffsetY = 2;
  c.beginPath();
  c.arc(x, y, 18, 0, Math.PI*2);
  c.fillStyle = '#4a4238';
  c.fill();
  c.restore();

  c.beginPath();
  c.arc(x, y, 18, 0, Math.PI*2);
  const g = c.createRadialGradient(x-4, y-4, 2, x, y, 18);
  g.addColorStop(0, '#9a8f7f');
  g.addColorStop(1, '#5a5045');
  c.fillStyle = g;
  c.fill();
  c.strokeStyle = '#2a2418';
  c.lineWidth = 2;
  c.stroke();

  c.beginPath();
  c.arc(x, y, 12, 0, Math.PI*2);
  c.strokeStyle = 'rgba(127,216,255,0.5)';
  c.lineWidth = 1.5;
  c.stroke();
}

function isDecorOnPath(decor, lvl, slots) {
  const margin = DECOR_PATH_CLEAR;
  if (decorTouchesPath(decor.x, decor.y, lvl.path, margin)) return true;
  if (lvl.altPath && decorTouchesPath(decor.x, decor.y, lvl.altPath, margin)) return true;
  if (decorTouchesSlots(decor.x, decor.y, slots, DECOR_SLOT_CLEAR)) return true;
  return false;
}

function buildBackground(idx){
  const lvl = LEVELS[idx];
  const slots = validateSlots(lvl.slots, lvl, lvl.path);

  const g = bgCtx.createRadialGradient(W/2, FIELD_H/2, 50, W/2, FIELD_H/2, W);
  g.addColorStop(0, THEME.grassLight);
  g.addColorStop(0.6, THEME.grass1);
  g.addColorStop(1, THEME.grass2);
  bgCtx.fillStyle = g;
  bgCtx.fillRect(0, 0, W, FIELD_H);

  for(let i=0;i<120;i++){
    const x = (i * 173) % W;
    const y = (i * 257) % FIELD_H;
    const r = 10 + (i % 5) * 5;
    bgCtx.beginPath();
    bgCtx.arc(x, y, r, 0, Math.PI*2);
    bgCtx.fillStyle = 'rgba(80,140,80,' + (0.04 + (i%3)*0.02) + ')';
    bgCtx.fill();
  }
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if((r+c)%2===0){
        bgCtx.fillStyle = 'rgba(255,255,255,0.01)';
        bgCtx.fillRect(c*CELL, r*CELL, CELL, CELL);
      }
    }
  }

  const decor = lvl.decor || {};

  const underTrees   = (decor.trees   || []).filter(t => isDecorOnPath(t, lvl, slots));
  const underRocks   = (decor.rocks   || []).filter(r => isDecorOnPath(r, lvl, slots));
  const underFlowers = (decor.flowers || []).filter(f => isDecorOnPath(f, lvl, slots));

  for(const f of underFlowers) drawFlower(bgCtx, f.x, f.y);
  for(const r of underRocks)   drawRock(bgCtx, r.x, r.y);
  for(const t of underTrees)   drawTree(bgCtx, t.x, t.y);

  for(const s of slots){
    const x = s.c * CELL + CELL/2;
    const y = s.r * CELL + CELL/2;
    drawSlotBaseTo(bgCtx, x, y, false);
  }

  drawPathTo(bgCtx, lvl.path, 'main');
  if(lvl.altPath) drawPathTo(bgCtx, lvl.altPath, 'alt');

  const topTrees   = (decor.trees   || []).filter(t => !isDecorOnPath(t, lvl, slots));
  const topRocks   = (decor.rocks   || []).filter(r => !isDecorOnPath(r, lvl, slots));
  const topFlowers = (decor.flowers || []).filter(f => !isDecorOnPath(f, lvl, slots));

  bgCtx.save();
  bgCtx.shadowColor = 'rgba(0,0,0,0.35)';
  bgCtx.shadowBlur = 6;
  bgCtx.shadowOffsetY = 2;
  for(const f of topFlowers) drawFlower(bgCtx, f.x, f.y);
  for(const r of topRocks)   drawRock(bgCtx, r.x, r.y);
  for(const t of topTrees)   drawTree(bgCtx, t.x, t.y);
  bgCtx.restore();

  const vig = bgCtx.createRadialGradient(W/2, FIELD_H/2, FIELD_H*0.3, W/2, FIELD_H/2, W);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.4)');
  bgCtx.fillStyle = vig;
  bgCtx.fillRect(0, 0, W, FIELD_H);
}

function drawTree(c, x, y){
  c.fillStyle = '#5d4037';
  c.fillRect(x - 3, y - 6, 6, 22);
  c.fillStyle = '#4e342e';
  c.fillRect(x - 3, y - 6, 3, 22);

  c.beginPath();
  c.arc(x - 9, y - 12, 14, 0, Math.PI*2);
  c.arc(x + 9, y - 12, 14, 0, Math.PI*2);
  c.arc(x, y - 22, 16, 0, Math.PI*2);
  c.fillStyle = '#1b5e20';
  c.fill();

  c.beginPath();
  c.arc(x - 8, y - 14, 12, 0, Math.PI*2);
  c.arc(x + 8, y - 14, 12, 0, Math.PI*2);
  c.arc(x, y - 24, 14, 0, Math.PI*2);
  c.fillStyle = '#2e7d32';
  c.fill();

  c.beginPath();
  c.arc(x - 9, y - 18, 5, 0, Math.PI*2);
  c.arc(x + 3, y - 26, 4, 0, Math.PI*2);
  c.fillStyle = 'rgba(129,199,132,0.75)';
  c.fill();
}

function drawRock(c, x, y){
  c.beginPath();
  c.moveTo(x - 11, y + 2);
  c.lineTo(x - 7, y - 9);
  c.lineTo(x + 4, y - 11);
  c.lineTo(x + 12, y - 2);
  c.lineTo(x + 9, y + 5);
  c.lineTo(x - 3, y + 6);
  c.closePath();
  c.fillStyle = '#7f8c8d';
  c.fill();
  c.strokeStyle = '#566573';
  c.lineWidth = 1.5;
  c.stroke();

  c.beginPath();
  c.moveTo(x - 5, y - 7);
  c.lineTo(x + 2, y - 9);
  c.lineTo(x + 4, y - 3);
  c.closePath();
  c.fillStyle = 'rgba(220,230,235,0.55)';
  c.fill();
}

function drawFlower(c, x, y){
  c.strokeStyle = '#4caf50';
  c.lineWidth = 1.5;
  c.beginPath();
  c.moveTo(x, y + 5);
  c.lineTo(x, y - 4);
  c.stroke();
  const colors = ['#f1c40f', '#e74c3c', '#e91e63', '#fff'];
  const color = colors[Math.floor(x + y) % colors.length];
  for(let i=0;i<5;i++){
    const a = (i/5) * Math.PI * 2;
    const px = x + Math.cos(a) * 3.5;
    const py = y - 4 + Math.sin(a) * 3.5;
    c.beginPath();
    c.arc(px, py, 2.8, 0, Math.PI*2);
    c.fillStyle = color;
    c.fill();
  }
  c.beginPath();
  c.arc(x, y - 4, 2, 0, Math.PI*2);
  c.fillStyle = '#f39c12';
  c.fill();
}

function update(){
  if(debugTimer > 0) debugTimer--;
  fogTime += 0.02;
  menuTime += 0.016;
  if(victoryFireworks > 0){
    victoryFireworks--;
    if(victoryFireworks % 15 === 0){
      const fx = 100 + Math.random() * (W - 200);
      const fy = 100 + Math.random() * 400;
      const colors = ['#f1c40f','#e74c3c','#3498db','#2ecc71','#9b59b6','#ff6b35'];
      const col = colors[Math.floor(Math.random() * colors.length)];
      spawnParticles(fx, fy, 20, { color: col, speed: 5, size: 3, life: 40, gravity: 0.05 });
    }
  }

  for(let i=hitMarks.length-1;i>=0;i--){
    hitMarks[i].t--;
    if(hitMarks[i].t<=0) hitMarks.splice(i,1);
  }

  updateParticles();

  saveTimer++;
  if(saveTimer >= 300){ flushSave(); saveTimer = 0; }

  if(achievementPopupActive){
    achievementPopupTimer--;
    if(achievementPopupTimer <= 0){
      achievementPopupActive = null;
      if(achievementPopupQueue.length > 0){
        achievementPopupActive = achievementPopupQueue.shift();
        achievementPopupTimer = 240;
      }
    }
  }

  if(screen !== 'playing' || !game || game.state !== 'playing') return;
  if(paused) return;

  if(lightningReady > 0) lightningReady--;

  for(let i=game.lightningFX.length-1;i>=0;i--){
    game.lightningFX[i].t--;
    if(game.lightningFX[i].t<=0) game.lightningFX.splice(i,1);
  }
  for(let i=game.healFX.length-1;i>=0;i--){
    game.healFX[i].t--;
    if(game.healFX[i].t<=0) game.healFX.splice(i,1);
  }

  if(game.money > save.stats.maxMoney){
    save.stats.maxMoney = game.money;
    if (game.money % 10 === 0) checkAchievements();
  }

  for(let step=0; step<gameSpeed; step++){
    stepUpdate();
    if(game.state !== 'playing') break;
  }
}

function stepUpdate(){
  if(!game.waveActive){
    if(game.currentWave < game.waves.length){
      game.waveTimer--;
      if(game.waveTimer <= 0){
        const w = game.waves[game.currentWave];
        game.waveActive = true;
        game.spawnLeft = w.count;
        game.spawnTimer = 0;
        game.currentType = w.type;
        log('Волна ' + (game.currentWave+1) + ' / ' + game.waves.length);
      }
    }
  } else {
    if(game.spawnLeft > 0){
      game.spawnTimer--;
      if(game.spawnTimer <= 0){
        const t = ENEMIES[game.currentType];
        const useAlt = game.altPath && Math.random() < 0.55;
        const path = useAlt ? game.altPath : game.path;
        game.enemies.push({
          x: path[0].x, y: path[0].y,
          pathIndex: 0,
          hp: t.hp, maxHp: t.hp,
          speed: t.speed, baseSpeed: t.speed,
          reward: t.reward, color: t.color, size: t.size,
          type: game.currentType,
          slowTimer: 0, dead: false,
          healCooldown: 90, path: path
        });
        game.spawnLeft--;
        game.spawnTimer = game.waves[game.currentWave].interval;
      }
    } else if(game.enemies.length === 0){
      game.waveActive = false;
      game.currentWave++;
      game.money += 20;
      spawnMoneyPopup(W/2, FIELD_H/2, 20);
      game.waveTimer = 90;
      const prev = save.bestWave[game.levelIndex] || 0;
      if(game.currentWave > prev){
        save.bestWave[game.levelIndex] = game.currentWave;
        persistSave();
      }
      if(game.currentWave >= game.waves.length){
        game.state = (game.levelIndex < LEVELS.length-1) ? 'levelComplete' : 'won';
        if(game.levelIndex + 2 > save.unlockedLevels){
          save.unlockedLevels = Math.min(game.levelIndex + 2, LEVELS.length);
        }
        save.stats.levelsCompleted = Math.max(save.stats.levelsCompleted, game.levelIndex + 1);
        if(game.levelIndex === 9) save.stats.level10Completed = true;
        if(game.lives === game.startLives){
          save.stats.perfectLevels++;
          if(usedSpeedThisLevel) save.stats.speedrunLevels++;
          if(game.modifiers.fog) save.stats.fogPerfect++;
        }
        if(game.state === 'won') victoryFireworks = 300;
        persistSave();
        checkAchievements();
      }
    }
  }

  for(const healer of game.enemies){
    if(healer.type !== 'healer' || healer.dead) continue;
    healer.healCooldown--;
    if(healer.healCooldown > 0) continue;
    healer.healCooldown = 120;
    const healRadius2 = 70*70;
    let healed = false;
    for(const e of game.enemies){
      if(e === healer || e.dead) continue;
      if(e.hp >= e.maxHp) continue;
      if(dist2(healer.x, healer.y, e.x, e.y) <= healRadius2){
        e.hp = Math.min(e.maxHp, e.hp + ENEMIES.healer.heal);
        game.healFX.push({ x: e.x, y: e.y, t: 30 });
        healed = true;
      }
    }
    if(healed) game.healFX.push({ x: healer.x, y: healer.y, t: 20 });
  }

  for(let i=game.enemies.length-1;i>=0;i--){
    const e = game.enemies[i];
    if(e.slowTimer > 0){ e.slowTimer--; e.speed = e.baseSpeed*0.4; }
    else e.speed = e.baseSpeed;

    if(e.pathIndex >= e.path.length-1){
      game.lives--;
      game.enemies.splice(i,1);
      triggerShake(4, 8);
      if(game.lives <= 0) game.state = 'lost';
      continue;
    }
    const target = e.path[e.pathIndex+1];
    const dx = target.x - e.x, dy = target.y - e.y;
    const d = Math.sqrt(dx*dx+dy*dy);
    if(d < e.speed){ e.x = target.x; e.y = target.y; e.pathIndex++; }
    else { e.x += dx/d*e.speed; e.y += dy/d*e.speed; }
  }

  for(const t of game.towers){
    t.cooldown--;
    if(t.cooldown > 0) continue;
    const stats = towerStats(t);
    const range2 = stats.range * stats.range;
    let target = null, minD2 = range2;
    for(const e of game.enemies){
      if(e.type !== 'healer') continue;
      const d2 = dist2(t.x, t.y, e.x, e.y);
      if(d2 < minD2){ minD2 = d2; target = e; }
    }
    if(!target){
      minD2 = range2;
      for(const e of game.enemies){
        const d2 = dist2(t.x, t.y, e.x, e.y);
        if(d2 < minD2){ minD2 = d2; target = e; }
      }
    }
    if(target){
      t.angle = Math.atan2(target.y - t.y, target.x - t.x);
      game.bullets.push({
        x: t.x, y: t.y, target: target,
        damage: stats.damage, speed: stats.bulletSpeed,
        color: stats.bulletColor, splash: stats.splash, slow: stats.slow,
        sourceType: t.type
      });
      t.cooldown = stats.fireRate;
    }
  }

  for(let i=game.bullets.length-1;i>=0;i--){
    const b = game.bullets[i];
    if(!b.target || b.target.dead){
      let nt = null, minD2 = Infinity;
      for(const e of game.enemies){
        if(e.dead) continue;
        const d2 = dist2(b.x, b.y, e.x, e.y);
        if(d2 < minD2){ minD2 = d2; nt = e; }
      }
      if(nt) b.target = nt;
      else { game.bullets.splice(i,1); continue; }
    }
    const dx = b.target.x - b.x, dy = b.target.y - b.y;
    const d = Math.sqrt(dx*dx+dy*dy);
    if(d < b.speed + 3){
      if(b.splash > 0){
        game.explosions.push({ x: b.target.x, y: b.target.y, radius: 0, maxR: b.splash, alpha: 1 });
        spawnExplosion(b.target.x, b.target.y, b.splash);
        const s2 = b.splash*b.splash;
        for(let j=game.enemies.length-1;j>=0;j--){
          const e = game.enemies[j];
          if(e.dead) continue;
          if(dist2(b.target.x, b.target.y, e.x, e.y) <= s2){
            e.hp -= b.damage;
            hitMarks.push({x:e.x, y:e.y, t:15, color:'#ffcc00'});
            if(b.slow > 0) e.slowTimer = Math.max(e.slowTimer, b.slow);
            if(e.hp <= 0 && !e.dead){
              e.dead = true;
              game.money += e.reward;
              spawnMoneyPopup(e.x, e.y, e.reward);
              spawnKillParticles(e.x, e.y, e.color);
              registerKill(e, b.sourceType);
              game.enemies.splice(j,1);
            }
          }
        }
      } else {
        b.target.hp -= b.damage;
        hitMarks.push({x:b.target.x, y:b.target.y, t:10, color:b.color});
        if(b.slow > 0){
          b.target.slowTimer = Math.max(b.target.slowTimer, b.slow);
          if(!b.target._countedSlow){
            save.stats.iceSlowed++;
            b.target._countedSlow = true;
            spawnFreezeParticles(b.target.x, b.target.y);
            checkAchievements();
          }
        }
        if(b.target.hp <= 0 && !b.target.dead){
          b.target.dead = true;
          game.money += b.target.reward;
          spawnMoneyPopup(b.target.x, b.target.y, b.target.reward);
          spawnKillParticles(b.target.x, b.target.y, b.target.color);
          registerKill(b.target, b.sourceType);
          const idx = game.enemies.indexOf(b.target);
          if(idx !== -1) game.enemies.splice(idx,1);
        }
      }
      game.bullets.splice(i,1);
    } else {
      b.x += dx/d*b.speed;
      b.y += dy/d*b.speed;
    }
  }

  for(let i=game.explosions.length-1;i>=0;i--){
    const ex = game.explosions[i];
    ex.radius += 4; ex.alpha -= 0.07;
    if(ex.alpha <= 0) game.explosions.splice(i,1);
  }
}

function registerKill(enemy, sourceType){
  save.stats.totalKills++;
  if(enemy.type === 'healer') save.stats.healersKilled++;
  if(sourceType === 'sniper') save.stats.sniperKills++;
  checkAchievements();
}

function draw(){
  ctx.fillStyle = '#0a0a18';
  ctx.fillRect(0, 0, W, H);

  if(screen === 'menu') return drawMenu();
  if(screen === 'howto') return drawHowTo();
  if(screen === 'codex') return drawCodex();
  if(screen === 'levels') return drawLevelSelect();
  if(screen === 'achievements') return drawAchievements();
  if(screen === 'settings') return drawSettings();

  let ox = 0, oy = 0;
  if (shakeTime > 0) {
    ox = (Math.random()-0.5) * shakeAmount;
    oy = (Math.random()-0.5) * shakeAmount;
    shakeTime--;
    shakeAmount *= 0.9;
    if (shakeTime <= 0) shakeAmount = 0;
  }

  ctx.save();
  ctx.translate(ox, oy);

  ctx.drawImage(bgCanvas, 0, 0, W, FIELD_H);

  drawSlotOverlay();

  if(game.selected && game.hoverCell){
    const cfg = TOWERS[game.selected];
    const stats = towerStats({type: game.selected, level: 1});
    const check = canPlace(game.hoverCell, cfg);
    ctx.beginPath();
    ctx.arc(game.hoverCell.x, game.hoverCell.y, stats.range, 0, Math.PI*2);
    ctx.fillStyle = check.ok ? 'rgba(74,158,255,0.15)' : 'rgba(255,0,0,0.15)';
    ctx.fill();
  }

  if(game.selectedTower){
    const t = game.selectedTower;
    const stats = towerStats(t);
    ctx.beginPath();
    ctx.arc(t.x, t.y, stats.range, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(241,196,15,0.12)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(241,196,15,0.7)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  for(const t of game.towers) drawTowerShape(t, t === game.selectedTower);
  for(const e of game.enemies) drawEnemy(e);

  for(const b of game.bullets){
    ctx.beginPath();
    ctx.arc(b.x, b.y, 4, 0, Math.PI*2);
    ctx.fillStyle = b.color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  for(const h of hitMarks){
    const a = h.t/15;
    ctx.beginPath();
    ctx.arc(h.x, h.y, 8 + (1-a)*10, 0, Math.PI*2);
    ctx.strokeStyle = h.color;
    ctx.globalAlpha = a;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  for(const ex of game.explosions){
    ctx.beginPath();
    ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,150,0,'+(ex.alpha*0.35)+')';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,220,0,'+ex.alpha+')';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  for(const hf of game.healFX){
    const a = hf.t/30;
    ctx.strokeStyle = 'rgba(233,30,99,'+a+')';
    ctx.lineWidth = 2;
    const s = 6 + (1-a)*4;
    ctx.beginPath();
    ctx.moveTo(hf.x - s, hf.y); ctx.lineTo(hf.x + s, hf.y);
    ctx.moveTo(hf.x, hf.y - s); ctx.lineTo(hf.x, hf.y + s);
    ctx.stroke();
  }

  for(const lf of game.lightningFX){
    drawLightningBolt(lf.x, lf.y, lf.t/20);
  }

  drawParticles();

  if(lightningArmed && game.hoverCell){
    ctx.beginPath();
    ctx.arc(game.hoverCell.x, game.hoverCell.y, 25, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,0,0.8)';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(game.hoverCell.x-30, game.hoverCell.y);
    ctx.lineTo(game.hoverCell.x+30, game.hoverCell.y);
    ctx.moveTo(game.hoverCell.x, game.hoverCell.y-30);
    ctx.lineTo(game.hoverCell.x, game.hoverCell.y+30);
    ctx.strokeStyle = 'rgba(255,255,0,0.4)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  if(game.modifiers.fog){
    ctx.fillStyle = 'rgba(20,25,45,' + FOG_DARKEN + ')';
    ctx.fillRect(0, 0, W, FIELD_H);
    drawFogOverlay();
  }

  if(screenFlash > 0){
    ctx.fillStyle = 'rgba(255,255,200,' + (screenFlash * 0.5) + ')';
    ctx.fillRect(0, 0, W, FIELD_H);
  }

  ctx.restore();

  drawHUD();
  drawUI();
  drawLightningButton();
  drawToast();

  if(paused && game.state === 'playing') drawPauseOverlay();

  if(game.state === 'lost') drawOverlay('💀 ПОРАЖЕНИЕ', THEME.blood, 'Нажми, чтобы заново');
  else if(game.state === 'won') drawOverlay('🏆 ПОБЕДА!', THEME.gold, 'Все 10 уровней пройдены!');
  else if(game.state === 'levelComplete') drawOverlay('✅ УРОВЕНЬ ПРОЙДЕН!', '#2ecc71', 'Нажми для следующего');

  drawAchievementPopup();
}

function drawSlotOverlay(){
  const t = menuTime;
  for(const s of game.slots){
    const x = s.c * CELL + CELL/2;
    const y = s.r * CELL + CELL/2;
    const occupied = hasTower({col: s.c, row: s.r});
    if(occupied) continue;
    const pulse = 0.5 + Math.sin(t*3 + s.c) * 0.3;
    ctx.strokeStyle = 'rgba(127,216,255,' + pulse + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - 6, y); ctx.lineTo(x + 6, y);
    ctx.moveTo(x, y - 6); ctx.lineTo(x, y + 6);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, y, 14, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(127,216,255,' + (pulse * 0.3) + ')';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function drawLightningBolt(endX, endY, alpha){
  ctx.strokeStyle = 'rgba(255,255,150,'+alpha+')';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';

  const segments = [];
  let prevX = endX, prevY = 0;
  segments.push({x: prevX, y: prevY});
  for(let i=0;i<7;i++){
    prevX += (Math.random()-0.5)*35;
    prevY = (endY/7)*(i+1);
    segments.push({x: prevX, y: prevY});
  }
  segments.push({x: endX, y: endY});

  ctx.beginPath();
  ctx.moveTo(segments[0].x, segments[0].y);
  for(let i=1;i<segments.length;i++) ctx.lineTo(segments[i].x, segments[i].y);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,'+alpha+')';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,150,'+(alpha*0.6)+')';
  ctx.lineWidth = 2;
  for(let i=1;i<segments.length-1;i++){
    if(Math.random() < 0.5){
      const s = segments[i];
      const bx = s.x + (Math.random()-0.5)*30;
      const by = s.y + 15;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(bx, by);
      ctx.stroke();
    }
  }
}

function drawTowerShape(t, isSelected){
  const cfg = TOWERS[t.type];
  const x = t.x, y = t.y;
  const angle = t.angle || -Math.PI/2;

  if (isSelected) {
    ctx.beginPath();
    ctx.arc(x, y, 22, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(241,196,15,0.2)';
    ctx.fill();
  }

  ctx.beginPath();
  ctx.ellipse(x, y+6, 17, 8, 0, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fill();

  ctx.save();
  try {
    ctx.translate(x, y);
    const baseR = 15;
    switch(cfg.shape){
      case 'square':
        ctx.beginPath();
        roundRect(-baseR+2, -baseR+2, baseR*2-4, baseR*2-4, 4);
        ctx.fillStyle = darken(cfg.color, 0.4);
        ctx.fill();
        ctx.strokeStyle = cfg.color;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.beginPath();
        roundRect(-baseR+7, -baseR+7, baseR*2-14, baseR*2-14, 2);
        ctx.fillStyle = cfg.color;
        ctx.fill();
        break;
      case 'hex':
        ctx.beginPath();
        for(let i=0;i<6;i++){
          const a = -Math.PI/2 + i*Math.PI/3;
          const px = Math.cos(a)*baseR;
          const py = Math.sin(a)*baseR;
          if(i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fillStyle = darken(cfg.color, 0.4);
        ctx.fill();
        ctx.strokeStyle = cfg.color;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, baseR-5, 0, Math.PI*2);
        ctx.fillStyle = cfg.color;
        ctx.fill();
        break;
      case 'rect':
        ctx.beginPath();
        roundRect(-baseR+3, -baseR-1, baseR*2-6, baseR*2+2, 3);
        ctx.fillStyle = darken(cfg.color, 0.4);
        ctx.fill();
        ctx.strokeStyle = cfg.color;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.beginPath();
        roundRect(-baseR+7, -baseR+3, baseR*2-14, baseR*2-6, 2);
        ctx.fillStyle = cfg.color;
        ctx.fill();
        break;
      case 'diamond':
        ctx.beginPath();
        ctx.moveTo(0, -baseR);
        ctx.lineTo(baseR, 0);
        ctx.lineTo(0, baseR);
        ctx.lineTo(-baseR, 0);
        ctx.closePath();
        ctx.fillStyle = darken(cfg.color, 0.4);
        ctx.fill();
        ctx.strokeStyle = cfg.color;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, -baseR+5);
        ctx.lineTo(baseR-5, 0);
        ctx.lineTo(0, baseR-5);
        ctx.lineTo(-baseR+5, 0);
        ctx.closePath();
        ctx.fillStyle = cfg.color;
        ctx.fill();
        break;
    }

    ctx.rotate(angle);

    switch(t.type){
      case 'basic': {
        ctx.beginPath();
        ctx.arc(0, 0, 7, 0, Math.PI*2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.strokeStyle = cfg.color;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#e0e0e0';
        ctx.fillRect(5, -2, 10, 4);
        ctx.strokeStyle = '#888';
        ctx.lineWidth = 1;
        ctx.strokeRect(5, -2, 10, 4);
        break;
      }
      case 'fire': {
        ctx.beginPath();
        ctx.arc(0, 0, 6, 0, Math.PI*2);
        ctx.fillStyle = '#ffcc00';
        ctx.fill();
        const flame = 1 + Math.sin(menuTime * 10) * 0.15;
        ctx.beginPath();
        ctx.moveTo(3, -5*flame);
        ctx.quadraticCurveTo(12, -3, 14*flame, 0);
        ctx.quadraticCurveTo(12, 3, 3, 5*flame);
        ctx.closePath();
        ctx.fillStyle = '#ff6b35';
        ctx.fill();
        ctx.strokeStyle = '#ffcc00';
        ctx.lineWidth = 1;
        ctx.stroke();
        break;
      }
      case 'sniper': {
        ctx.fillStyle = '#333';
        ctx.fillRect(2, -3, 20, 6);
        ctx.strokeStyle = '#666';
        ctx.lineWidth = 1;
        ctx.strokeRect(2, -3, 20, 6);
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI*2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.strokeStyle = cfg.color;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#111';
        ctx.fillRect(20, -2, 3, 4);
        break;
      }
      case 'ice': {
        ctx.beginPath();
        ctx.arc(0, 0, 6, 0, Math.PI*2);
        ctx.fillStyle = '#d6eaf8';
        ctx.fill();
        ctx.strokeStyle = cfg.color;
        ctx.lineWidth = 2;
        ctx.stroke();
        for(let i=0;i<3;i++){
          const a = -Math.PI/2 + (i-1)*0.7;
          const cx = Math.cos(a)*11;
          const cy = Math.sin(a)*11;
          ctx.beginPath();
          ctx.arc(cx, cy, 3, 0, Math.PI*2);
          ctx.fillStyle = '#fff';
          ctx.fill();
          ctx.strokeStyle = cfg.color;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.moveTo(10, -3);
        ctx.lineTo(16, 0);
        ctx.lineTo(10, 3);
        ctx.closePath();
        ctx.fillStyle = '#d6eaf8';
        ctx.fill();
        break;
      }
    }
  } finally {
    ctx.restore();
  }

  if(isSelected){
    ctx.beginPath();
    ctx.arc(x, y, 19, 0, Math.PI*2);
    ctx.strokeStyle = THEME.gold;
    ctx.lineWidth = 2.5;
    ctx.setLineDash([5, 3]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  for(let i=0;i<t.level-1;i++){
    const ang = -Math.PI/2 + (i - (t.level-2)/2) * 0.7;
    const px = x + Math.cos(ang)*14;
    const py = y + Math.sin(ang)*14 - 20;
    drawStar(px, py, 5, THEME.gold);
  }
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}
function darken(hex, amount){
  const num = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.floor(((num >> 16) & 255) * (1-amount)));
  const g = Math.max(0, Math.floor(((num >> 8) & 255) * (1-amount)));
  const b = Math.max(0, Math.floor((num & 255) * (1-amount)));
  return '#' + ((r<<16)|(g<<8)|b).toString(16).padStart(6, '0');
}
function drawStar(x, y, r, color){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const ang = -Math.PI/2 + i*Math.PI/5;
    const rr = i%2===0 ? r : r*0.45;
    const px = x + Math.cos(ang)*rr;
    const py = y + Math.sin(ang)*rr;
    if(i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 0.5;
  ctx.stroke();
}

function drawEnemy(e){
  const col = settings.colorBlind ? (CB_COLORS[e.type] || e.color) : e.color;

  ctx.beginPath();
  ctx.arc(e.x, e.y+2, e.size, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fill();

  if(e.slowTimer > 0){
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.size + 4, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(93,173,226,0.35)';
    ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(e.x, e.y, e.size, 0, Math.PI*2);
  const g = ctx.createRadialGradient(e.x-e.size*0.3, e.y-e.size*0.3, 2, e.x, e.y, e.size);
  g.addColorStop(0, lighten(col, 0.3));
  g.addColorStop(1, col);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = e.slowTimer > 0 ? THEME.ice : '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();

  if(e.type === 'healer'){
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(e.x - 4, e.y); ctx.lineTo(e.x + 4, e.y);
    ctx.moveTo(e.x, e.y - 4); ctx.lineTo(e.x, e.y + 4);
    ctx.stroke();
  } else if(e.type === 'boss'){
    ctx.fillStyle = THEME.gold;
    ctx.beginPath();
    ctx.moveTo(e.x - 12, e.y - e.size - 2);
    ctx.lineTo(e.x - 8, e.y - e.size - 10);
    ctx.lineTo(e.x - 4, e.y - e.size - 4);
    ctx.lineTo(e.x, e.y - e.size - 12);
    ctx.lineTo(e.x + 4, e.y - e.size - 4);
    ctx.lineTo(e.x + 8, e.y - e.size - 10);
    ctx.lineTo(e.x + 12, e.y - e.size - 2);
    ctx.closePath();
    ctx.fill();
  } else if(e.type === 'tank'){
    ctx.strokeStyle = '#566573';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.size - 4, 0, Math.PI*2);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.arc(e.x - 4, e.y - 3, 2, 0, Math.PI*2);
    ctx.arc(e.x + 4, e.y - 3, 2, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
  }

  const hpW = e.size*2;
  const p = Math.max(0, e.hp/e.maxHp);
  ctx.fillStyle = '#300';
  ctx.fillRect(e.x-hpW/2, e.y-e.size-8, hpW, 4);
  ctx.fillStyle = p>0.5 ? '#2ecc71' : p>0.25 ? '#f39c12' : '#e74c3c';
  ctx.fillRect(e.x-hpW/2, e.y-e.size-8, hpW*p, 4);
}

function lighten(hex, amount){
  const num = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.floor(((num >> 16) & 255) + 255*amount));
  const g = Math.min(255, Math.floor(((num >> 8) & 255) + 255*amount));
  const b = Math.min(255, Math.floor((num & 255) + 255*amount));
  return '#' + ((r<<16)|(g<<8)|b).toString(16).padStart(6, '0');
}

let fogCacheCanvas = null;
let fogCacheTimer = 0;
let fogCacheReady = false;

function drawFogOverlay(){
  if (!fogCacheCanvas) {
    fogCacheCanvas = document.createElement('canvas');
    fogCacheCanvas.width = W;
    fogCacheCanvas.height = FIELD_H;
  }
  if (!fogCacheReady || fogCacheTimer-- <= 0) {
    fogCacheTimer = 3;
    const fc = fogCacheCanvas.getContext('2d');
    fc.clearRect(0, 0, W, FIELD_H);
    fc.globalCompositeOperation = 'screen';
    const t = fogTime;
    for(let i=0;i<5;i++){
      const ox = Math.sin(t*0.3 + i*1.7) * 60;
      const oy = Math.cos(t*0.25 + i*2.1) * 40;
      const fx = W/2 + (i-2)*140 + ox;
      const fy = FIELD_H/2 + (i%3-1)*180 + oy;
      const grad = fc.createRadialGradient(fx, fy, 0, fx, fy, 180);
      grad.addColorStop(0, 'rgba(180,190,210,0.10)');
      grad.addColorStop(1, 'rgba(180,190,210,0)');
      fc.fillStyle = grad;
      fc.fillRect(0, 0, W, FIELD_H);
    }
    fogCacheReady = true;
  }
  ctx.drawImage(fogCacheCanvas, 0, 0);
}

function drawUI(){
  const g = ctx.createLinearGradient(0, UI_Y, 0, H);
  g.addColorStop(0, '#1a1208');
  g.addColorStop(1, '#0f0a04');
  ctx.fillStyle = g;
  ctx.fillRect(0, UI_Y, W, H - UI_Y);
  ctx.strokeStyle = THEME.goldDark;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, UI_Y);
  ctx.lineTo(W, UI_Y);
  ctx.stroke();

  if(game.selectedTower){
    drawTowerPanel(game.selectedTower);
    return;
  }

  const btnY = UI_Y + 8;
  const keys = game.availableTowers;
  const n = keys.length;
  const btnW = (W - 20 - (n-1)*8) / n;

}

function drawTowerCard(bx, by, bw, bh, cfg, canBuy, isSel){
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  roundRect(bx+3, by+3, bw, bh, 8); ctx.fill();

  const g = ctx.createLinearGradient(0, by, 0, by+bh);
  g.addColorStop(0, isSel ? '#5a3a1a' : '#3a2810');
  g.addColorStop(1, isSel ? '#2d1f0e' : '#1a1208');
  ctx.fillStyle = g;
  roundRect(bx, by, bw, bh, 8); ctx.fill();

  ctx.strokeStyle = isSel ? '#fff' : (canBuy ? cfg.color : '#333');
  ctx.lineWidth = isSel ? 3 : 1.5;
  roundRect(bx, by, bw, bh, 8); ctx.stroke();

  ctx.beginPath();
  ctx.arc(bx+bw/2, by+28, 16, 0, Math.PI*2);
  ctx.fillStyle = cfg.color;
  ctx.globalAlpha = canBuy ? 1 : 0.35;
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.font = '18px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText(cfg.icon, bx+bw/2, by+29);

  ctx.font = 'bold 10px Georgia, serif';
  ctx.fillStyle = canBuy ? THEME.parchment : '#555';
  ctx.fillText(cfg.name, bx+bw/2, by+56);

  ctx.font = 'bold 12px "Courier New", monospace';
  ctx.fillStyle = canBuy ? THEME.gold : '#555';
  ctx.fillText(cfg.cost, bx+bw/2, by+74);

  ctx.font = '9px Arial';
  ctx.fillStyle = canBuy ? '#aaa' : '#444';
  ctx.fillText('⚔'+cfg.damage+' 🎯'+cfg.range, bx+bw/2, by+90);

  if(!canBuy){
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    roundRect(bx, by, bw, bh, 8); ctx.fill();
  }
}

const LIGHTNING_BTN = { x: 10, y: 56, w: 60, h: 60 };

function drawLightningButton(){
  const cx = LIGHTNING_BTN.x + LIGHTNING_BTN.w/2;
  const cy = LIGHTNING_BTN.y + LIGHTNING_BTN.h/2;
  const r = LIGHTNING_BTN.w/2;

  const ready = lightningReady <= 0;
  const canAfford = game.money >= LIGHTNING_COST;
  const active = lightningArmed;

  ctx.beginPath();
  ctx.arc(cx+2, cy+2, r, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  const g = ctx.createRadialGradient(cx-r*0.3, cy-r*0.3, 4, cx, cy, r);
  if (active) { g.addColorStop(0, '#fff8a0'); g.addColorStop(1, '#c9a000'); }
  else if (ready && canAfford) { g.addColorStop(0, '#3a2810'); g.addColorStop(1, '#1a1208'); }
  else { g.addColorStop(0, '#1a1a1a'); g.addColorStop(1, '#0a0a0a'); }
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = active ? '#fff' : (ready && canAfford ? THEME.gold : '#333');
  ctx.lineWidth = active ? 3 : 2;
  ctx.stroke();

  if (ready && canAfford && !active) {
    const pulse = 0.5 + Math.sin(menuTime * 4) * 0.5;
    ctx.beginPath();
    ctx.arc(cx, cy, r + 4 + pulse*3, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(241,196,15,' + (0.3 * (1-pulse)) + ')';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  ctx.font = 'bold 24px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = (ready && canAfford) || active ? '#fff' : '#444';
  ctx.fillText('⚡', cx, cy-4);

  ctx.font = 'bold 11px "Courier New", monospace';
  ctx.fillStyle = canAfford ? THEME.gold : '#555';
  ctx.fillText(LIGHTNING_COST, cx, cy + 18);

  if (!ready) {
    const pct = 1 - lightningReady / LIGHTNING_COOLDOWN;
    ctx.beginPath();
    ctx.arc(cx, cy, r - 2, -Math.PI/2, -Math.PI/2 + Math.PI*2*pct);
    ctx.strokeStyle = THEME.gold;
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.font = 'bold 12px Arial';
    ctx.fillStyle = '#fff';
    ctx.fillText(Math.ceil(lightningReady/60) + 'с', cx, cy);
  }
}

function drawToast(){
  if(debugTimer <= 0) return;
  const t = 1 - debugTimer / 120;
  const alpha = t < 0.1 ? t*10 : (t > 0.8 ? (1-t)*5 : 1);
  const y = FIELD_H - 50 - Math.sin(t * Math.PI) * 15;

  ctx.font = 'bold 13px Georgia, serif';
  const tw = Math.max(ctx.measureText(debugMsg).width + 40, 120);
  const x = W/2 - tw/2;

  ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
  const g = ctx.createLinearGradient(0, y, 0, y+32);
  g.addColorStop(0, '#e8d4a8');
  g.addColorStop(1, '#c9b184');
  ctx.fillStyle = g;
  roundRect(x, y, tw, 32, 4); ctx.fill();
  ctx.strokeStyle = '#8b6f3f';
  ctx.lineWidth = 1;
  roundRect(x, y, tw, 32, 4); ctx.stroke();

  ctx.fillStyle = '#3a2810';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(debugMsg, W/2, y+16);
  ctx.globalAlpha = 1;
}

function drawSword(x, y){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-0.3);
  ctx.fillStyle = '#c0c8d0';
  ctx.beginPath();
  ctx.moveTo(-2, -30);
  ctx.lineTo(2, -30);
  ctx.lineTo(3, 20);
  ctx.lineTo(0, 28);
  ctx.lineTo(-3, 20);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#5a6878';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = '#8b6f3f';
  ctx.fillRect(-6, 20, 12, 6);
  ctx.fillStyle = '#5a3a1a';
  ctx.fillRect(-2, 26, 4, 12);
  ctx.beginPath();
  ctx.arc(0, 40, 4, 0, Math.PI*2);
  ctx.fillStyle = THEME.gold;
  ctx.fill();
  ctx.restore();
}

function drawWoodBtn(btn, text){
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  roundRect(btn.x + 4, btn.y + 4, btn.w, btn.h, 8);
  ctx.fill();

  const g = ctx.createLinearGradient(0, btn.y, 0, btn.y + btn.h);
  g.addColorStop(0, '#8b6f3f');
  g.addColorStop(0.4, '#6d5330');
  g.addColorStop(1, '#4a3820');
  ctx.fillStyle = g;
  roundRect(btn.x, btn.y, btn.w, btn.h, 8);
  ctx.fill();

  ctx.save();
  roundRect(btn.x, btn.y, btn.w, btn.h, 8);
  ctx.clip();
  for(let i=0;i<6;i++){
    const yy = btn.y + 6 + i * 7;
    ctx.fillStyle = 'rgba(40,25,10,' + (0.15 + (i%2)*0.1) + ')';
    ctx.fillRect(btn.x, yy, btn.w, 1.5);
  }
  ctx.restore();

  ctx.strokeStyle = '#3a2810';
  ctx.lineWidth = 2;
  roundRect(btn.x, btn.y, btn.w, btn.h, 8);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(220,180,120,0.4)';
  ctx.lineWidth = 1;
  roundRect(btn.x + 2, btn.y + 2, btn.w - 4, btn.h - 4, 6);
  ctx.stroke();

  drawNail(btn.x + 8, btn.y + 8);
  drawNail(btn.x + btn.w - 8, btn.y + 8);
  drawNail(btn.x + 8, btn.y + btn.h - 8);
  drawNail(btn.x + btn.w - 8, btn.y + btn.h - 8);

  ctx.font = 'bold 17px Georgia, serif';
  ctx.fillStyle = '#000';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, btn.x + btn.w/2 + 1, btn.y + btn.h/2 + 1);
  ctx.fillStyle = '#f5e6c8';
  ctx.fillText(text, btn.x + btn.w/2, btn.y + btn.h/2);
}

function drawNail(x, y){
  ctx.beginPath();
  ctx.arc(x, y, 3, 0, Math.PI*2);
  ctx.fillStyle = '#3a2a15';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x - 0.8, y - 0.8, 1.2, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,220,150,0.7)';
  ctx.fill();
}

  const gap = 8;
  const startY = 70;

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, startY, W, viewH);

    const barH = Math.max(30, viewH * viewH / totalH);

    ctx.fillStyle = 'rgba(241,196,15,0.6)';

function wrapText(text, x, y, maxWidth, lineHeight){
  const words = text.split(' ');
  let line = '';
  let yy = y;
  for(const word of words){
    const test = line + word + ' ';
    if(ctx.measureText(test).width > maxWidth && line !== ''){
      ctx.fillText(line, x, yy);
      line = word + ' ';
      yy += lineHeight;
    } else {
      line = test;
    }
  }
  if(line) ctx.fillText(line, x, yy);
}

    y += 16;
  }

  drawWoodBtn({ x: W/2-80, y: H-60, w: 160, h: 45 }, '◀  НАЗАД');
}

// ============================================================
// === ВВОД ===
// ============================================================
function getPos(e){
  const r = canvas.getBoundingClientRect();
  const sx = W / r.width;
  const sy = H / r.height;
  let cx, cy;
  if(e.touches && e.touches.length){
    cx = e.touches[0].clientX; cy = e.touches[0].clientY;
  } else if(e.changedTouches && e.changedTouches.length){
    cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY;
  } else {
    cx = e.clientX; cy = e.clientY;
  }
  return { x: (cx-r.left)*sx, y: (cy-r.top)*sy };
}

function inBtn(p, b){
  return p.x > b.x && p.x < b.x+b.w && p.y > b.y && p.y < b.y+b.h;
}

function onMove(e){
  if(screen !== 'playing' || !game) return;
  const p = getPos(e);
  game.hoverCell = cellAt(p.x, p.y);
}

function onRightClick(e){
  if(screen !== 'playing' || !game) return;
  e.preventDefault();
  if(lightningArmed){ lightningArmed = false; log('Молния отменена'); }
  else if(game.selected){ game.selected = null; }
  else if(game.selectedTower){ game.selectedTower = null; }
}

function onClick(e){
  e.preventDefault();
  const p = getPos(e);

  if(screen === 'menu'){
    if(inBtn(p, MENU_BTN.play)){
      const startLvl = Math.min(getCompletedLevelsCount(), LEVELS.length-1);
      initLevel(startLvl);
      screen = 'playing';
    } else if(inBtn(p, MENU_BTN.levels)) screen = 'levels';
    else if(inBtn(p, MENU_BTN.achv)){ screen = 'achievements'; achScrollY = 0; }
    else if(inBtn(p, MENU_BTN.codex)){ screen = 'codex'; codexTab = 'towers'; }
    else if(inBtn(p, MENU_BTN.howto)) screen = 'howto';
    else if(inBtn(p, MENU_BTN.settings)) screen = 'settings';
    else if(inBtn(p, MENU_BTN.exit)){
      if(confirm('Выйти из игры?')){
        window.close();
        document.body.innerHTML = '<h1 style="color:white;text-align:center;margin-top:40vh;font-family:Georgia">Спасибо за игру! 👋</h1>';
      }
    }
    return;
  }

  if(screen === 'settings'){
    if(inBtn(p, SETTINGS_BTN.particles)){
      const order = ['low','med','high'];
      const i = order.indexOf(settings.particles);
      settings.particles = order[(i+1) % order.length];
      saveSettings();
    } else if(inBtn(p, SETTINGS_BTN.shake)){
      settings.screenShake = !settings.screenShake;
      saveSettings();
    } else if(inBtn(p, SETTINGS_BTN.ranges)){
      settings.showRanges = !settings.showRanges;
      saveSettings();
    } else if(inBtn(p, SETTINGS_BTN.cb)){
      settings.colorBlind = !settings.colorBlind;
      saveSettings();
    } else if(inBtn(p, SETTINGS_BTN.export)){
      const code = exportProgress();
      if (code) {
        copyToClipboard(code).then(() => {
          settingsToast = '✅ Код скопирован в буфер обмена';
          settingsToastTimer = 120;
        }).catch(() => {
          prompt('Скопируй код:', code);
          settingsToast = '✅ Код показан в диалоге';
          settingsToastTimer = 120;
        });
      } else {
        settingsToast = '❌ Не удалось экспортировать';
        settingsToastTimer = 120;
      }
    } else if(inBtn(p, SETTINGS_BTN.import)){
      const code = prompt('Вставь код прогресса:');
      if (code) {
        if (importProgress(code)) {
          settingsToast = '✅ Прогресс импортирован';
          settingsToastTimer = 120;
        } else {
          settingsToast = '❌ Неверный код';
          settingsToastTimer = 120;
        }
      }
    } else if(inBtn(p, SETTINGS_BTN.back)){
      screen = 'menu';
    }
    return;
  }

  if(screen === 'achievements'){
    const back = { x: W/2-80, y: H-50, w: 160, h: 42 };
    if(inBtn(p, back)){ screen = 'menu'; return; }
    return;
  }

  if(screen === 'levels'){
    const back = { x: W/2-80, y: H-55, w: 160, h: 45 };
    if(inBtn(p, back)){ screen = 'menu'; return; }
    const resetBtn = { x: 15, y: H-100, w: 130, h: 40 };
    if(inBtn(p, resetBtn)){
      if(confirm('Сбросить ВЕСЬ прогресс?')){
        save = { unlockedLevels: 1, bestWave: {}, stats: defaultStats(), achievements: {} };
        persistSave();
        flushSave();
      }
      return;
    }
    for(let i=0;i<LEVELS.length;i++){
      const b = getLevelBtn(i);
      if(inBtn(p, b) && isLevelUnlocked(i)){ initLevel(i); screen = 'playing'; return; }
    }
    return;
  }

  if(screen === 'codex'){
    const tabY = 70, tabW = 180, tabH = 36;
    const towersTab = { x: W/2-tabW-5, y: tabY, w: tabW, h: tabH };
    const enemiesTab = { x: W/2+5, y: tabY, w: tabW, h: tabH };
    const back = { x: W/2-80, y: H-55, w: 160, h: 45 };

    if(inBtn(p, back)){ screen = 'menu'; return; }
    if(inBtn(p, towersTab)){ codexTab = 'towers'; return; }
    if(inBtn(p, enemiesTab)){ codexTab = 'enemies'; return; }
    return;
  }

  if(screen === 'howto'){
    const back = { x: W/2-80, y: H-60, w: 160, h: 45 };
    if(inBtn(p, back)) screen = 'menu';
    return;
  }

  if(game.state === 'lost'){ initLevel(game.levelIndex); return; }
  if(game.state === 'levelComplete'){
    if(game.levelIndex + 1 < LEVELS.length) initLevel(game.levelIndex + 1);
    else screen = 'menu';
    return;
  }
  if(game.state === 'won'){ screen = 'menu'; return; }

  if(paused){
    if(inBtn(p, PAUSE_BTN.resume)) paused = false;
    else if(inBtn(p, PAUSE_BTN.restart)) initLevel(game.levelIndex);
    else if(inBtn(p, PAUSE_BTN.menu)){ screen = 'menu'; paused = false; }
    return;
  }

  if(game.selectedTower && p.y >= UI_Y){
    const t = game.selectedTower;
    const btnW = 130, btnH = 45;
    const bx = W - btnW - 15;
    const closeX = bx - 25;

    if(p.x > closeX && p.x < closeX+20 && p.y > UI_Y+15 && p.y < UI_Y+35){
      game.selectedTower = null;
      return;
    }
    if(p.x > bx && p.x < bx+btnW && p.y > UI_Y+15 && p.y < UI_Y+15+btnH){
      const upCost = upgradeCost(t);
      if(t.level >= MAX_UPGRADE_LEVEL){ log('Максимальный уровень!'); return; }
      if(game.money < upCost){ log('Не хватает монет!'); return; }
      game.money -= upCost;
      t.level++;
      if(t.level === 3){
        save.stats.totalUpgrades++;
        persistSave();
        checkAchievements();
      }
      log('⬆ Уровень ' + t.level + '!');
      return;
    }
    if(p.x > bx && p.x < bx+btnW && p.y > UI_Y+70 && p.y < UI_Y+70+btnH){
      const cfg = TOWERS[t.type];
      let invested = cfg.cost;
      for(let lvl=2;lvl<=t.level;lvl++){
        invested += Math.round(cfg.cost * UPGRADE_COST_MULT[lvl-1]);
      }
      const refund = Math.round(invested * SELL_RATE);
      game.money += refund;
      spawnMoneyPopup(t.x, t.y, refund);
      const idx = game.towers.indexOf(t);
      if(idx !== -1) game.towers.splice(idx, 1);
      game.selectedTower = null;
      log('💸 Продано за ' + refund + '💰');
      return;
    }
    if(p.y < FIELD_H){
      const cell = cellAt(p.x, p.y);
      const other = getTowerAt(cell);
      if(other && other !== t){ game.selectedTower = other; return; }
      game.selectedTower = null;
    }
  }

  const pauseBtn = { x: W-38, y: 6, w: 32, h: 32 };
  if(inBtn(p, pauseBtn)){ paused = true; return; }

  const speedBtn = { x: W-74, y: 6, w: 32, h: 32 };
  if(inBtn(p, speedBtn)){
    gameSpeed = gameSpeed === 1 ? 2 : 1;
    if(gameSpeed === 2) usedSpeedThisLevel = true;
    return;
  }

  if(inBtn(p, LIGHTNING_BTN)){
    if(lightningArmed){ lightningArmed = false; log('Отменено'); return; }
    if(lightningReady > 0){ log('Перезаряжается!'); return; }
    if(game.money < LIGHTNING_COST){ log('Не хватает монет!'); return; }
    lightningArmed = true;
    game.selected = null;
    game.selectedTower = null;
    log('Кликни по врагу!');
    return;
  }

  if(lightningArmed && p.y < FIELD_H){
    let best = null, minD = 60;
    for(const e of game.enemies){
      const d = dist(p.x, p.y, e.x, e.y);
      if(d < minD){ minD = d; best = e; }
    }
    if(best){
      game.lightningFX.push({ x: best.x, y: best.y, t: 20 });
      spawnLightningBurst(best.x, best.y);
      game.money -= LIGHTNING_COST;
      if(best.type === 'healer') save.stats.healersKilled++;
      save.stats.totalKills++;
      save.stats.totalLightnings++;
      persistSave();
      checkAchievements();
      best.dead = true;
      const idx = game.enemies.indexOf(best);
      if(idx !== -1) game.enemies.splice(idx, 1);
      lightningReady = LIGHTNING_COOLDOWN;
      lightningArmed = false;
      log('⚡ Молния!');
    } else {
      log('Кликни ближе к врагу!');
    }
    return;
  }

  if(p.y < FIELD_H && !game.selected && !lightningArmed){
    const cell = cellAt(p.x, p.y);
    const t = getTowerAt(cell);
    if(t){
      game.selectedTower = t;
      game.selected = null;
      return;
    }
  }

  if(p.y >= UI_Y){
    const btnY = UI_Y + 8;
    const keys = game.availableTowers;
    const n = keys.length;
    const btnW = (W - 20 - (n-1)*8) / n;
    const btnH = H - UI_Y - 16;
    for(let i=0;i<n;i++){
      const bx = 10 + i*(btnW+8);
      if(p.x > bx && p.x < bx+btnW && p.y > btnY && p.y < btnY+btnH){
        const key = keys[i];
        const cfg = TOWERS[key];
        if(game.money < cfg.cost){ log('Не хватает монет!'); return; }
        if(game.towers.length >= game.maxTowers){ log('Лимит башен!'); return; }
        game.selected = (game.selected === key) ? null : key;
        game.selectedTower = null;
        lightningArmed = false;
        if(game.selected) log('Выбрана: ' + cfg.name);
        return;
      }
    }
    return;
  }

  if(p.y < FIELD_H && game.selected){
    const cell = cellAt(p.x, p.y);
    const cfg = TOWERS[game.selected];
    const check = canPlace(cell, cfg);
    if(!check.ok){ log(check.reason); return; }
    game.towers.push({
      x: cell.x, y: cell.y, col: cell.col, row: cell.row,
      type: game.selected, cooldown: 0, range: cfg.range, level: 1,
      angle: -Math.PI/2
    });
    game.money -= cfg.cost;
    save.stats.totalTowers++;
    persistSave();
    checkAchievements();
    game.hoverCell = null;
    log('Построено! Осталось: ' + game.money + '💰');
    if(game.money < cfg.cost) game.selected = null;
  }
}

canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mousedown', function(e){
  if(e.button === 2) onRightClick(e);
  else onClick(e);
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('touchstart', function(e){
  onMove(e); onClick(e);
}, { passive: false });

canvas.addEventListener('wheel', function(e){
  if(screen === 'achievements'){
    const cardH = 76, gap = 8;
    const totalH = ACHIEVEMENTS.length * (cardH + gap);
    const startY = 70;
    const viewH = H - startY - 60;
    const maxScroll = Math.max(0, totalH - viewH);
    achScrollY = Math.max(0, Math.min(maxScroll, achScrollY + e.deltaY * 0.5));
    e.preventDefault();
  }
}, { passive: false });

canvas.addEventListener('touchmove', function(e){
  if(screen === 'achievements'){
    const t = e.touches[0];
    const y = t.clientY;
    if(achDragStart !== null){
      const dy = achDragStart - y;
      const cardH = 76, gap = 8;
      const totalH = ACHIEVEMENTS.length * (cardH + gap);
      const startY = 70;
      const viewH = H - startY - 60;
      const maxScroll = Math.max(0, totalH - viewH);
      achScrollY = Math.max(0, Math.min(maxScroll, achScrollY + dy));
      achDragStart = y;
      e.preventDefault();
    }
  }
}, { passive: false });

canvas.addEventListener('touchstart', function(e){
  if(screen === 'achievements'){
    achDragStart = e.touches[0].clientY;
  }
}, { passive: false });

canvas.addEventListener('touchend', function(){
  achDragStart = null;
});

// ============================================================
// === АВТО-МАСШТАБ ===
// ============================================================
function fitCanvas() {
  const availW = window.innerWidth;
  const availH = window.innerHeight;
  const scale = Math.min(availW / W, availH / H);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', fitCanvas);
fitCanvas();

const _origDraw = draw;
draw = function(){
  _origDraw();
  if(screen === 'playing' && game && game.state === 'playing' && !paused){
    drawNextWaveHint();
  }
};

window.addEventListener('beforeunload', flushSave);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (screen === 'playing' && game && game.state === 'playing') paused = true;
    flushSave();
  }
});

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
